<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us White Water Rafting </title>
    <meta name="description" content="Contact us here">
    <meta name="author" content="FIDEL BROWN">
    <link rel="stylesheet" href="styles/rafting2.css">
</head>

<body>
    <header>
        <img src="images/logo.png" alt="logo">
        <nav class="stufs">
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <h1>White Water Rafting Company</h1>
            <p>123 Murtala Muhammed Highway</p>
            <p>Cross River, Nigeria</p>
            <p>+234 (813) (295) (1641)</p>
            <p>Email: info@whitewater.com</p>
        </section>


        <section class="contact-container">


            <div class="map">
                <iframe src="https://www.google.com/maps?q=Nigeria&output=embed" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>

            <form class="contact-form">

                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Message Purpose</legend>

                    <label>
                        <input type="radio" name="purpose" value="general" checked>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" name="purpose" value="suggestion">
                        Website Suggestion
                    </label>
                </fieldset>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5"></textarea>

                <label class="checkbox">
                    <input type="checkbox" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="submit" class="btn-submit">Get in Touch!</button>

            </form>

        </section>


        <section class="employees">
            <h2>We Are Here to Serve You</h2>

            <div class="employee-grid">

                <figure>
                    <img src="images/employee1.png" alt="River Guide">
                    <figcaption>John Doe - Lead River Guide</figcaption>
                </figure>

                <figure>
                    <img src="images/employee2.png" alt="Safety Officer">
                    <figcaption>Jane Smith - Safety Officer</figcaption>
                </figure>

                <figure>
                    <img src="images/employee3.png" alt="Trip Coordinator">
                    <figcaption>Mike Johnson - Trip Coordinator</figcaption>
                </figure>

            </div>
        </section>
    </main>


    <footer>
        <p>© 2026 |WHITE WATER RAFTING | FIDEL BROWN | NIGERIA</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon"></a>

            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="LinkedIn Icon"></a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon"></a>

        </nav>

    </footer>


</body>

</html>
