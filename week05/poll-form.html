<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll form</title>
</head>

<body>

    <header>
        HTML FORM - User poll

    </header>

    <main>
        <form>
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email address">email address</label>
            <input type="email" id="useremail" name="useremail" required>

            <label for="quantity">What is your favorite browser</label>
            <select name="browser" id="browser">
                <option value="1">Goggle Chrome</option>
                <option value="2">Opera Mini</option>
                <option value="3">Mises Browser</option>
            </select>

            <label for="pet">Do you have a household Pet?</label>
            <input type="checkbox" id="pet" name="pet">

            <label for="feedback">List the places you have lived</label>
            <textarea id="feedback" name="feedback" rows="4" placeholder="Nigeria"></textarea>

            <button type="submit">Submit Poll</button>


        </form>
    </main>

    <footer>

    </footer>

</body>

</html>
